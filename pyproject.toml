[project]
name = "meeting-transcriber"
version = "0.1.0"
description = "Local meeting transcription, diarization, summarization, and model comparison"
requires-python = ">=3.10,<3.12"
dependencies = [
    "httpx>=0.28,<1",
    "python-dotenv>=1.2,<2",
    "whisperx==3.8.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

